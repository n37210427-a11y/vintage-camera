<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minimal Retro Camera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', "Segoe UI", Roboto, sans-serif;
            background-color: #09090B;
            color: #FAFAFA;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 모달 내부 입력 및 스크롤 허용 */
        #settingsModal, #galleryModal {
            touch-action: auto;
            user-select: auto;
            -webkit-user-select: auto;
        }

        .font-mono-hud { font-family: 'JetBrains Mono', monospace; }

        .retro-date-stamp {
            font-family: 'Orbitron', monospace;
            color: rgba(255, 255, 255, 0.94);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
            letter-spacing: 0.08em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .draggable-strip {
            cursor: grab;
            overflow-x: auto;
            touch-action: pan-x;
            scroll-behavior: smooth;
        }
        .draggable-strip:active { cursor: grabbing; }

        /* 아이폰(iOS) 스타일 토글 스위치 */
        .ios-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
        }
        .ios-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .ios-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #39393D;
            transition: .25s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 34px;
        }
        .ios-slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .25s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.35);
        }
        .ios-switch input:checked + .ios-slider {
            background-color: #34C759;
        }
        .ios-switch input:checked + .ios-slider:before {
            transform: translateX(20px);
        }

        @keyframes shutterFlash {
            0% { opacity: 0.95; }
            100% { opacity: 0; }
        }
        .animate-flash {
            animation: shutterFlash 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes recPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
        .animate-rec {
            animation: recPulse 1s infinite;
        }
    </style>
</head>
<body class="flex flex-col justify-between bg-[#09090B] text-zinc-100 pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">

    <!-- ==================== 1. 상단 미니멀 컨트롤 바 ==================== -->
    <header class="w-full max-w-2xl mx-auto px-4 pt-2.5 pb-1 flex items-center justify-between gap-2 z-20 shrink-0">
        <div class="flex items-center gap-1.5">
            <button id="soundToggleBtn" type="button"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-medium border transition-all bg-white text-zinc-950 border-white">
                <svg id="soundIconOn" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
                <svg id="soundIconOff" class="w-3.5 h-3.5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
                <span id="soundLabel">소리 ON</span>
            </button>

            <button id="settingsOpenBtn" type="button"
                class="flex items-center gap-1 px-3 py-1.5 rounded-full text-[11px] font-medium border border-zinc-700 bg-zinc-900 text-zinc-200 hover:bg-zinc-800 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>설정</span>
            </button>
        </div>

        <div class="flex items-center gap-1.5">
            <button id="autoSaveToggleBtn" type="button"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-medium border transition-all bg-white text-zinc-950 border-white">
                <span id="autoSaveDot" class="w-1.5 h-1.5 rounded-full bg-zinc-950"></span>
                <span id="autoSaveLabel">자동저장</span>
            </button>

            <button id="flipCameraBtn" type="button" aria-label="카메라 전환"
                class="p-2 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-white transition-transform active:rotate-180">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <!-- ==================== 2. 중앙 뷰파인더 & 비율 선택 & 초점거리 ==================== -->
    <main class="flex-1 w-full max-w-2xl mx-auto px-4 flex flex-col items-center justify-center min-h-0 gap-2 overflow-hidden">
        
        <!-- 화면 비율 선택 탭 -->
        <div class="flex items-center gap-1 bg-zinc-900 p-0.5 rounded-lg border border-zinc-800 shrink-0">
            <button type="button" data-ratio="3:4" class="ratio-btn px-2.5 py-0.5 rounded text-[11px] font-bold bg-white text-black transition-colors">3:4</button>
            <button type="button" data-ratio="1:1" class="ratio-btn px-2.5 py-0.5 rounded text-[11px] font-bold text-zinc-400 hover:text-white transition-colors">1:1</button>
            <button type="button" data-ratio="16:9" class="ratio-btn px-2.5 py-0.5 rounded text-[11px] font-bold text-zinc-400 hover:text-white transition-colors">16:9</button>
            <button type="button" data-ratio="full" class="ratio-btn px-2.5 py-0.5 rounded text-[11px] font-bold text-zinc-400 hover:text-white transition-colors">FULL</button>
        </div>

        <!-- 뷰파인더 프레임 -->
        <div id="viewfinderWrapper" class="flex-1 w-full min-h-0 flex items-center justify-center overflow-hidden">
            <div id="viewfinderFrame" class="relative h-full max-w-full aspect-[3/4] rounded-2xl overflow-hidden bg-black border border-zinc-800 shadow-2xl flex items-center justify-center transition-all duration-300">
                
                <video id="rawVideo" autoplay playsinline muted class="hidden"></video>
                <canvas id="viewfinderCanvas" class="w-full h-full block cursor-crosshair"></canvas>

                <!-- 비네팅 오버레이 -->
                <div id="vignetteOverlay" class="pointer-events-none absolute inset-0 transition-all duration-300"></div>

                <!-- 3x3 격자 오버레이 -->
                <div id="gridOverlay" class="hidden pointer-events-none absolute inset-0 grid grid-cols-3 grid-rows-3 z-10">
                    <div class="border-r border-b border-white/20"></div>
                    <div class="border-r border-b border-white/20"></div>
                    <div class="border-b border-white/20"></div>
                    <div class="border-r border-b border-white/20"></div>
                    <div class="border-r border-b border-white/20"></div>
                    <div class="border-b border-white/20"></div>
                    <div class="border-r border-white/20"></div>
                    <div class="border-r border-white/20"></div>
                    <div></div>
                </div>

                <!-- 녹화 배지 -->
                <div id="recBadge" class="hidden pointer-events-none absolute top-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 bg-red-600 text-white px-2.5 py-1 rounded-md font-mono-hud text-[11px] font-bold shadow">
                    <span class="w-2 h-2 rounded-full bg-white animate-rec"></span>
                    <span id="recTimer">REC 00:00</span>
                </div>

                <!-- 오버레이 1: 사용 필터 이름 태그 (위치 조정 가능) -->
                <div id="hudFilterBadge" class="pointer-events-none absolute top-3 left-3 z-10 flex items-center gap-1.5 bg-black/65 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/15 font-mono-hud text-[11px]">
                    <span id="hudCamCode" class="text-white font-bold">CYBER '04</span>
                    <span class="text-zinc-500">|</span>
                    <span id="hudFocalLength" class="text-zinc-300">35mm</span>
                </div>

                <!-- 오버레이 2: 위치 태그 (위치 조정 가능) -->
                <div id="hudLocationTag" class="hidden pointer-events-none absolute top-3 right-3 z-10 bg-black/65 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/15 font-mono-hud text-[11px] text-zinc-100 font-semibold">
                    📍 SEOUL
                </div>

                <!-- 오버레이 3: 날짜 스탬프 (위치 조정 가능) -->
                <div id="liveDateStamp" class="pointer-events-none absolute bottom-3 right-3.5 z-10 retro-date-stamp text-xs sm:text-sm font-bold">
                    '26 11 15
                </div>

                <div id="flashLayer" class="pointer-events-none absolute inset-0 bg-white opacity-0 z-20"></div>

                <div id="toastBadge" class="pointer-events-none absolute bottom-10 left-1/2 -translate-x-1/2 z-20 px-3.5 py-1 rounded-full bg-white text-black text-xs font-semibold opacity-0 transition-opacity duration-200 whitespace-nowrap shadow-lg">
                    갤러리에 저장되었습니다
                </div>

                <div id="cameraErrorBox" class="hidden absolute inset-0 z-30 bg-zinc-950/95 flex items-center justify-center p-5 text-center">
                    <div class="max-w-xs space-y-3">
                        <p class="text-sm font-semibold text-white">카메라 접근 권한이 필요합니다</p>
                        <p id="cameraErrorMsg" class="text-xs text-zinc-400 leading-relaxed">
                            브라우저 설정에서 카메라 접근을 허용해 주세요.
                        </p>
                        <button id="retryCameraBtn" type="button" class="px-4 py-2 rounded-lg bg-white text-black text-xs font-bold">
                            카메라 다시 연결
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 초점거리 눈금자 -->
        <div class="w-full flex flex-col items-center shrink-0">
            <div class="relative w-full max-w-sm flex items-center justify-center">
                <div class="pointer-events-none absolute top-0.5 bottom-0.5 left-1/2 -translate-x-1/2 w-[1.5px] bg-white z-10"></div>
                <div class="pointer-events-none absolute inset-y-0 left-0 w-10 bg-gradient-to-r from-[#09090B] to-transparent z-10"></div>
                <div class="pointer-events-none absolute inset-y-0 right-0 w-10 bg-gradient-to-l from-[#09090B] to-transparent z-10"></div>

                <div id="focalStrip" class="draggable-strip w-full no-scrollbar flex items-center py-1 px-[45%] gap-6 snap-x snap-mandatory">
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== 3. 하단 컨트롤러 & 셔터 ==================== -->
    <footer class="w-full max-w-2xl mx-auto px-4 pt-1 pb-3.5 flex flex-col gap-2 shrink-0 z-20">
        
        <!-- 카테고리 필터 탭 -->
        <div class="flex items-center justify-center gap-1.5">
            <button type="button" data-cat="all" class="cat-btn px-3 py-1 rounded-full text-[11px] font-semibold bg-white text-black transition-colors">
                전체 (30)
            </button>
            <button type="button" data-cat="digital" class="cat-btn px-3 py-1 rounded-full text-[11px] font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-white transition-colors">
                옛날 디카 (15)
            </button>
            <button type="button" data-cat="film" class="cat-btn px-3 py-1 rounded-full text-[11px] font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-white transition-colors">
                필름 카메라 (15)
            </button>
        </div>

        <!-- 필터 캐러셀 -->
        <div class="relative w-full flex items-center">
            <button id="prevCamBtn" type="button" aria-label="이전 필터"
                class="hidden sm:flex shrink-0 w-8 h-8 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 items-center justify-center text-white mr-2">
                ‹
            </button>

            <div class="relative flex-1 overflow-hidden">
                <div class="pointer-events-none absolute inset-y-0 left-0 w-5 bg-gradient-to-r from-[#09090B] to-transparent z-10"></div>
                <div class="pointer-events-none absolute inset-y-0 right-0 w-5 bg-gradient-to-l from-[#09090B] to-transparent z-10"></div>

                <div id="cameraCarousel" class="draggable-strip flex items-center gap-2 no-scrollbar py-0.5 px-5 snap-x snap-mandatory">
                </div>
            </div>

            <button id="nextCamBtn" type="button" aria-label="다음 필터"
                class="hidden sm:flex shrink-0 w-8 h-8 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 items-center justify-center text-white ml-2">
                ›
            </button>
        </div>

        <!-- 하단 셔터 및 갤러리 버튼 -->
        <div class="flex items-center justify-between pt-1 px-2 sm:px-6">
            <div class="flex items-center bg-zinc-900 p-1 rounded-full border border-zinc-800">
                <button id="modePhotoBtn" type="button" class="px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white text-black">
                    사진
                </button>
                <button id="modeVideoBtn" type="button" class="px-3.5 py-1 rounded-full text-xs font-bold transition-all text-zinc-400 hover:text-white">
                    영상
                </button>
            </div>

            <button id="captureBtn" type="button" aria-label="촬영하기"
                class="relative rounded-full border-[3px] border-white p-1 flex items-center justify-center transition-transform active:scale-90 shadow-xl" style="width: 62px; height: 62px;">
                <span id="captureInner" class="w-full h-full rounded-full bg-white transition-all duration-200"></span>
            </button>

            <button id="galleryOpenBtn" type="button" disabled
                class="relative w-11 h-11 rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 flex items-center justify-center disabled:opacity-35 hover:border-white transition-all">
                <img id="thumbImg" src="" alt="갤러리 썸네일" class="w-full h-full object-cover hidden">
                <video id="thumbVideo" muted playsinline class="w-full h-full object-cover hidden"></video>
                <svg id="thumbPlaceholder" class="w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span id="mediaCountBadge" class="hidden absolute bottom-0.5 right-0.5 bg-white text-black font-mono-hud text-[9px] font-bold px-1 rounded">
                    0
                </span>
            </button>
        </div>
    </footer>

    <!-- ==================== 4. 아이폰(iOS) 스타일 상세 설정 모달 ==================== -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="w-full max-w-md bg-[#1C1C1E] border-t sm:border border-zinc-800 rounded-t-3xl sm:rounded-3xl p-5 space-y-5 shadow-2xl max-h-[88vh] overflow-y-auto">
            
            <!-- 상단 헤더 -->
            <div class="flex items-center justify-between pb-2 border-b border-zinc-800">
                <h3 class="text-base font-bold text-white">카메라 설정</h3>
                <button id="settingsCloseBtn" type="button" class="px-3 py-1 rounded-full bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold text-white">
                    완료
                </button>
            </div>

            <!-- 그룹 1: 화면 가이드 -->
            <div class="space-y-1.5">
                <div class="px-2 text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">뷰파인더 가이드</div>
                <div class="bg-[#2C2C2E] rounded-2xl divide-y divide-zinc-700/60 overflow-hidden">
                    <div class="flex items-center justify-between px-4 py-3">
                        <span class="text-sm text-white font-medium">3x3 격자선</span>
                        <label class="ios-switch">
                            <input type="checkbox" id="settingGrid">
                            <span class="ios-slider"></span>
                        </label>
                    </div>
                    <div class="flex items-center justify-between px-4 py-3">
                        <span class="text-sm text-white font-medium">비네트 (가장자리 음영)</span>
                        <label class="ios-switch">
                            <input type="checkbox" id="settingVignette">
                            <span class="ios-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 그룹 2: 사용 필터 이름 태그 -->
            <div class="space-y-1.5">
                <div class="px-2 text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">필터 이름 태그</div>
                <div class="bg-[#2C2C2E] rounded-2xl divide-y divide-zinc-700/60 overflow-hidden">
                    <div class="flex items-center justify-between px-4 py-3">
                        <div>
                            <div class="text-sm text-white font-medium">필터 이름 표시</div>
                            <div class="text-[11px] text-zinc-400">촬영 화면 및 저장 사진에 기종명 표시</div>
                        </div>
                        <label class="ios-switch">
                            <input type="checkbox" id="settingFilterTag">
                            <span class="ios-slider"></span>
                        </label>
                    </div>
                    <div class="flex items-center justify-between px-4 py-3">
                        <span class="text-sm text-zinc-300">표시 위치</span>
                        <select id="filterPosSelect" class="bg-zinc-800 text-white text-xs font-medium rounded-lg px-2.5 py-1.5 border border-zinc-700 outline-none">
                            <option value="top-left">좌측 상단</option>
                            <option value="top-right">우측 상단</option>
                            <option value="bottom-left">좌측 하단</option>
                            <option value="bottom-right">우측 하단</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 그룹 3: 위치 태그 (GPS + 직접 입력) -->
            <div class="space-y-1.5">
                <div class="px-2 text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">위치 태그 (Location)</div>
                <div class="bg-[#2C2C2E] rounded-2xl divide-y divide-zinc-700/60 overflow-hidden">
                    <div class="flex items-center justify-between px-4 py-3">
                        <div>
                            <div class="text-sm text-white font-medium">위치 태그 표시</div>
                            <div class="text-[11px] text-zinc-400">장소명을 사진에 스탬프로 기록</div>
                        </div>
                        <label class="ios-switch">
                            <input type="checkbox" id="settingLocationOn">
                            <span class="ios-slider"></span>
                        </label>
                    </div>
                    <div class="px-4 py-3 space-y-2">
                        <div class="flex items-center gap-2">
                            <input type="text" id="customLocationInput" placeholder="장소 입력 (예: SEOUL, GWANGJU)" 
                                class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-mono-hud uppercase outline-none focus:border-white">
                            <button id="gpsDetectBtn" type="button" class="px-3 py-2 rounded-xl bg-zinc-700 hover:bg-zinc-600 text-white text-xs font-semibold shrink-0 flex items-center gap-1">
                                <span>📍 현재위치</span>

            domEl.classList.remove('top-3', 'bottom-3', 'left-3', 'right-3', 'right-3.5', 'left-3.5');
            if (pos === 'top-left') domEl.classList.add('top-3', 'left-3');
            else if (pos === 'top-right') domEl.classList.add('top-3', 'right-3');
            else if (pos === 'bottom-left') domEl.classList.add('bottom-3', 'left-3.5');
            else if (pos === 'bottom-right') domEl.classList.add('bottom-3', 'right-3.5');
        }

        function initLUT() {
            const p = state.activePreset;
            for (let i = 0; i < 256; i++) {
                let norm = i / 255.0;
                let contrasted = (norm - 0.5) * p.contrast + 0.5 + (p.brightness / 255.0);
                contrasted = Math.min(1, Math.max(0, contrasted));

                if (p.monochrome) {
                    const val = Math.round(contrasted * 255);
                    state.lutR[i] = val;
                    state.lutG[i] = val;
                    state.lutB[i] = val;
                } else {
                    let r = contrasted * p.rgbGain[0] + (p.shadowTint[0] * (1 - contrasted) + p.highlightTint[0] * contrasted) / 255;
                    let g = contrasted * p.rgbGain[1] + (p.shadowTint[1] * (1 - contrasted) + p.highlightTint[1] * contrasted) / 255;
                    let b = contrasted * p.rgbGain[2] + (p.shadowTint[2] * (1 - contrasted) + p.highlightTint[2] * contrasted) / 255;

                    state.lutR[i] = Math.min(255, Math.max(0, Math.round(r * 255)));
                    state.lutG[i] = Math.min(255, Math.max(0, Math.round(g * 255)));
                    state.lutB[i] = Math.min(255, Math.max(0, Math.round(b * 255)));
                }
            }
        }

        function updateOpticsOverlays() {
            const p = state.activePreset;
            if (state.vignetteEnabled) {
                el.vignetteOverlay.style.background = `radial-gradient(circle, rgba(0,0,0,0) 48%, rgba(0,0,0,${p.vignette + 0.25}) 100%)`;
                el.vignetteOverlay.style.display = 'block';
            } else {
                el.vignetteOverlay.style.display = 'none';
            }
        }

        function applyLUTToImageData(imgData) {
            const data = imgData.data;
            const p = state.activePreset;
            const rLut = state.lutR, gLut = state.lutG, bLut = state.lutB;
            const sat = p.saturation;
            const grainAmt = p.grain * 45;

            for (let i = 0; i < data.length; i += 4) {
                let r = rLut[data[i]];
                let g = gLut[data[i + 1]];
                let b = bLut[data[i + 2]];
                const noise = (Math.random() - 0.5) * grainAmt;

                if (p.monochrome) {
                    const lum = r * 0.299 + g * 0.587 + b * 0.114 + noise;
                    data[i] = data[i + 1] = data[i + 2] = lum;
                } else {
                    const lum = r * 0.299 + g * 0.587 + b * 0.114;
                    data[i] = lum + (r - lum) * sat + noise;
                    data[i + 1] = lum + (g - lum) * sat + noise;
                    data[i + 2] = lum + (b - lum) * sat + noise;
                }
            }
            return imgData;
        }

        function centerActiveFocal(smooth = true) {
            const activeEl = el.focalStrip.querySelector(`[data-mm="${state.activeFocal.mm}"]`);
            if (!activeEl) return;
            const stripRect = el.focalStrip.getBoundingClientRect();
            const itemRect = activeEl.getBoundingClientRect();
            const offset = (itemRect.left + itemRect.width / 2) - (stripRect.left + stripRect.width / 2);
            el.focalStrip.scrollBy({ left: offset, behavior: smooth ? 'smooth' : 'auto' });
        }

        function buildCameraCarousel() {
            el.cameraCarousel.innerHTML = '';

        async function initWebcam() {
            try {
                if (state.stream) {
                    state.stream.getTracks().forEach(t => t.stop());
                }
                const constraints = {
                    video: { facingMode: state.facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                };
                state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                el.rawVideo.srcObject = state.stream;
                await el.rawVideo.play();
                el.cameraErrorBox.classList.add('hidden');
                requestAnimationFrame(renderLoop);
            } catch (err) {
                console.error(err);
                el.cameraErrorMsg.textContent = '카메라 접근 권한이 없거나 다른 앱이 사용 중입니다.';
                el.cameraErrorBox.classList.remove('hidden');
            }
        }

        function getCoverCropRect(srcW, srcH, dstW, dstH, zoom) {
            const srcRatio = srcW / srcH;
            const dstRatio = dstW / dstH;
            let baseW, baseH;

            if (srcRatio > dstRatio) {
                baseH = srcH;
                baseW = srcH * dstRatio;
            } else {
                baseW = srcW;
                baseH = srcW / dstRatio;
            }

            const sw = baseW / zoom;
            const sh = baseH / zoom;
            const sx = (srcW - sw) / 2;
            const sy = (srcH - sh) / 2;
            return { sx, sy, sw, sh };
        }

        function renderLoop() {
            if (el.rawVideo.readyState >= 2) {
                const vW = el.rawVideo.videoWidth;
                const vH = el.rawVideo.videoHeight;
                const cW = el.viewfinderFrame.clientWidth || 360;
                const cH = el.viewfinderFrame.clientHeight || 480;

                if (el.viewfinderCanvas.width !== cW || el.viewfinderCanvas.height !== cH) {
                    el.viewfinderCanvas.width = cW;
                    el.viewfinderCanvas.height = cH;
                }

                const vCtx = el.viewfinderCanvas.getContext('2d', { willReadFrequently: true });
                const { sx, sy, sw, sh } = getCoverCropRect(vW, vH, cW, cH, state.activeFocal.zoom);

                vCtx.save();
                if (state.facingMode === 'user') {
                    vCtx.translate(cW, 0);
                    vCtx.scale(-1, 1);
                }
                vCtx.drawImage(el.rawVideo, sx, sy, sw, sh, 0, 0, cW, cH);
                vCtx.restore();

                const frameData = vCtx.getImageData(0, 0, cW, cH);
                vCtx.putImageData(applyLUTToImageData(frameData), 0, 0);
            }
            requestAnimationFrame(renderLoop);
        }

        function updateLiveDateStamp() {
            let stampText = '';
            if (state.dateMode === 'real') {
                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                stampText = `'${yy} ${mm} ${dd}`;
            } else {
                stampText = state.customDateText || `'04 11 15`;
            }

            el.liveDateStamp.textContent = stampText;
            el.liveDateStamp.style.display = state.dateStampEnabled ? 'block' : 'none';
        }

        function playShutterSound() {
            if (!state.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(1200, ctx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.04);
                gain1.gain.setValueAtTime(0.35, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.04);

                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(320, ctx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.06);
                    gain2.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.06);
                }, 40);
            } catch (e) {}
        }

        // GPS 현재 위치 감지 함수
        function detectCurrentLocation() {
            if (!navigator.geolocation) {
                showToast('GPS를 지원하지 않는 브라우저입니다');
                return;
            }
            el.gpsDetectBtn.textContent = '찾는 중...';
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=en`);
                        const data = await res.json();
                        const city = data.address.city || data.address.town || data.address.county || data.address.state || 'SEOUL';
                        const cleanCity = city.replace(/si$|gu$|gun$/i, '').trim().toUpperCase();
                        state.locationText = cleanCity;
                        el.customLocationInput.value = cleanCity;
                        state.locationEnabled = true;
                        el.settingLocationOn.checked = true;
                        saveSettingsToLocalStorage();
                        applySettingsToUI();
                        showToast(`위치 설정됨: ${cleanCity}`);
                    } catch (e) {
                        const coordStr = `${latitude.toFixed(2)}°N, ${longitude.toFixed(2)}°E`;
                        state.locationText = coordStr;
                        el.customLocationInput.value = coordStr;
                        saveSettingsToLocalStorage();
                        applySettingsToUI();
                    }
                    el.gpsDetectBtn.textContent = '📍 현재위치';
                },
                () => {
                    showToast('위치 권한이 거부되었습니다');
                    el.gpsDetectBtn.textContent = '📍 현재위치';
                },
                { timeout: 6000 }
            );
        }

        // 캔버스 저장 시 선택한 4개 모서리 위치 좌표 계산 헬퍼
        function drawStampOnCanvas(ctx, text, pos, sw, sh, fontFamily, scaleFactor = 0.033) {
            const fontSize = Math.max(15, Math.round(Math.min(sw, sh) * scaleFactor));
            const padX = Math.round(sw * 0.04);
            const padY = Math.round(sh * 0.04);

            ctx.font = `bold ${fontSize}px ${fontFamily}`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.92)';
            ctx.shadowBlur = 7;

            let x, y;
            if (pos === 'top-left') {
                ctx.textAlign = 'left';
                x = padX;
                y = padY + fontSize * 0.8;
            } else if (pos === 'top-right') {
                ctx.textAlign = 'right';
                x = sw - padX;
                y = padY + fontSize * 0.8;
            } else if (pos === 'bottom-left') {
                ctx.textAlign = 'left';
                x = padX;
                y = sh - padY;
            } else {
                ctx.textAlign = 'right';
                x = sw - padX;
                y = sh - padY;
            }
            ctx.fillText(text, x, y);
        }

        function takePhoto() {
            playShutterSound();
            el.flashLayer.classList.add('animate-flash');
            setTimeout(() => el.flashLayer.classList.remove('animate-flash'), 320);

            const vW = el.rawVideo.videoWidth;
            const vH = el.rawVideo.videoHeight;
            const cW = el.viewfinderFrame.clientWidth;
            const cH = el.viewfinderFrame.clientHeight;

            const { sx, sy, sw, sh } = getCoverCropRect(vW, vH, cW, cH, state.activeFocal.zoom);

            el.photoCaptureCanvas.width = sw;
            el.photoCaptureCanvas.height = sh;
            const pCtx = el.photoCaptureCanvas.getContext('2d');

            pCtx.save();
            if (state.facingMode === 'user') {
                pCtx.translate(sw, 0);
                pCtx.scale(-1, 1);
            }
            pCtx.drawImage(el.rawVideo, sx, sy, sw, sh, 0, 0, sw, sh);
            pCtx.restore();

            const capData = pCtx.getImageData(0, 0, sw, sh);
            pCtx.putImageData(applyLUTToImageData(capData), 0, 0);

            if (state.vignetteEnabled) {
                const maxR = Math.max(sw, sh) * 0.72;
                const grad = pCtx.createRadialGradient(sw / 2, sh / 2, maxR * 0.35, sw / 2, sh / 2, maxR);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, `rgba(0,0,0,${state.activePreset.vignette + 0.25})`);
                pCtx.fillStyle = grad;
                pCtx.fillRect(0, 0, sw, sh);
            }

            // 1. 필터 이름 태그 합성
            if (state.filterTagEnabled) {
                const filterStr = `${state.activePreset.name} | ${state.activeFocal.label}`;
                drawStampOnCanvas(pCtx, filterStr, state.filterPos, sw, sh, "'JetBrains Mono', monospace", 0.03);
            }

            // 2. 위치 태그 합성
            if (state.locationEnabled && state.locationText.trim() !== '') {
                const locStr = `📍 ${state.locationText.trim().toUpperCase()}`;
                drawStampOnCanvas(pCtx, locStr, state.locationPos, sw, sh, "'JetBrains Mono', monospace", 0.032);
            }

            // 3. 날짜 스탬프 합성
            if (state.dateStampEnabled) {
                drawStampOnCanvas(pCtx, el.liveDateStamp.textContent, state.datePos, sw, sh, "'Orbitron', monospace", 0.035);
            }

            const dataUrl = el.photoCaptureCanvas.toDataURL('image/jpeg', 0.95);
            const item = {
                type: 'photo',
                url: dataUrl,
                filename: `CAM_${state.activePreset.id}_${Date.now()}.jpg`,
                camName: state.activePreset.name,
                focalLabel: state.activeFocal.label,
                timestamp: new Date().toLocaleString()
            };

            state.mediaItems.unshift(item);
            updateGalleryThumb();
            showToast('촬영 완료 & 갤러리 저장');

            if (state.autoSaveEnabled) {
                triggerInstantDownload(item.url, item.filename);
            }

            resetCameraEngine();
        }

        function triggerInstantDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.rel = 'noopener';
            document.body.appendChild(a);
            setTimeout(() => {
                a.click();
                document.body.removeChild(a);
            }, 50);
        }

        function resetCameraEngine() {
            setTimeout(() => {
                if (!el.rawVideo.paused) return;
                el.rawVideo.play().catch(() => {
                    initWebcam();
                });
            }, 300);
        }

        function toggleRecording() {
            if (!state.isRecording) {
                state.recordedChunks = [];
                try {
                    const canvasStream = el.viewfinderCanvas.captureStream(30);
                    let options = {};
                    if (MediaRecorder.isTypeSupported('video/mp4')) {
                        options = { mimeType: 'video/mp4' };
                    } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
                        options = { mimeType: 'video/webm;codecs=vp8' };
                    }
                    state.mediaRecorder = new MediaRecorder(canvasStream, options);
                    state.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) state.recordedChunks.push(e.data); };
                    state.mediaRecorder.onstop = () => {
                        const ext = state.mediaRecorder.mimeType && state.mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
                        const blob = new Blob(state.recordedChunks, { type: state.mediaRecorder.mimeType || 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const item = {
                            type: 'video',
                            url: url,
                            filename: `VID_${state.activePreset.id}_${Date.now()}.${ext}`,
                            camName: state.activePreset.name,
                            focalLabel: state.activeFocal.label,
                            timestamp: new Date().toLocaleString()
                        };
                        state.mediaItems.unshift(item);
                        updateGalleryThumb();
                        showToast('영상이 저장되었습니다');
                        if (state.autoSaveEnabled) triggerInstantDownload(item.url, item.filename);
                    };
                    state.mediaRecorder.start();
                    state.isRecording = true;
                    state.recStartTime = Date.now();
                    el.recBadge.classList.remove('hidden');
                    state.recTimerInterval = setInterval(() => {
                        const sec = Math.floor((Date.now() - state.recStartTime) / 1000);
                        const mm = String(Math.floor(sec / 60)).padStart(2, '0');
                        const ss = String(sec % 60).padStart(2, '0');
                        el.recTimer.textContent = `REC ${mm}:${ss}`;
                    }, 1000);
                } catch (e) {
                    alert('이 모바일 브라우저에서는 영상 녹화가 제한됩니다.');
                }
            } else {
                state.mediaRecorder.stop();
                state.isRecording = false;
                clearInterval(state.recTimerInterval);
                el.recBadge.classList.add('hidden');
            }
        }

        function updateGalleryThumb() {
            if (state.mediaItems.length === 0) {
                el.galleryOpenBtn.disabled = true;
                el.thumbImg.classList.add('hidden');
                el.thumbVideo.classList.add('hidden');
                el.thumbPlaceholder.classList.remove('hidden');
                el.mediaCountBadge.classList.add('hidden');
                return;
            }

            el.galleryOpenBtn.disabled = false;
            el.thumbPlaceholder.classList.add('hidden');
            el.mediaCountBadge.textContent = state.mediaItems.length;
            el.mediaCountBadge.classList.remove('hidden');

            const latest = state.mediaItems[0];
            if (latest.type === 'photo') {
                el.thumbImg.src = latest.url;
                el.thumbImg.classList.remove('hidden');
                el.thumbVideo.classList.add('hidden');
            } else {
                el.thumbVideo.src = latest.url;
                el.thumbVideo.classList.remove('hidden');
                el.thumbImg.classList.add('hidden');
            }
        }

        function openGallery(idx) {
            if (!state.mediaItems || state.mediaItems.length === 0) return;
            const safeIdx = Math.max(0, Math.min(idx, state.mediaItems.length - 1));
            state.currentModalIndex = safeIdx;
            const item = state.mediaItems[safeIdx];

            el.modalCounter.textContent = `${safeIdx + 1} / ${state.mediaItems.length}`;
            el.modalCamInfo.textContent = `${item.camName} · ${item.focalLabel}`;
            el.modalTimeInfo.textContent = item.timestamp;

            if (item.type === 'photo') {
                el.modalPhotoView.src = item.url;
                el.modalPhotoView.classList.remove('hidden');
                el.modalVideoView.classList.add('hidden');
                el.modalVideoView.pause();
            } else {
                el.modalVideoView.src = item.url;
                el.modalVideoView.classList.remove('hidden');
                el.modalPhotoView.classList.add('hidden');
            }

            el.modalDownloadBtn.onclick = () => triggerInstantDownload(item.url, item.filename);
            el.modalDeleteBtn.onclick = () => {
                state.mediaItems.splice(safeIdx, 1);
                updateGalleryThumb();
                if (state.mediaItems.length === 0) {
                    el.galleryModal.classList.add('hidden');
                } else {
                    openGallery(Math.max(0, safeIdx - 1));
                }
            };

            el.modalPrevBtn.onclick = () => openGallery((safeIdx - 1 + state.mediaItems.length) % state.mediaItems.length);
            el.modalNextBtn.onclick = () => openGallery((safeIdx + 1) % state.mediaItems.length);

            el.galleryModal.classList.remove('hidden');
        }

        function showToast(msg) {
            el.toastBadge.textContent = msg;
            el.toastBadge.classList.remove('opacity-0');
            setTimeout(() => el.toastBadge.classList.add('opacity-0'), 2000);
        }
    </script>
</body>
</html>
